spring:
  application:
    name: mvc-without-virtual-thread-app

  # JPA Configuration for Spring MVC
  datasource:
    url: jdbc:postgresql://localhost:5432/benchmark
    username: benchmark_user
    password: benchmark_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083
  tomcat:
    threads:
      # Each request holds a Tomcat thread for about 5s → about threads / 5 req/s.
      max: 200

benchmark:
  # Fixed platform thread pool size for parallel external API calls.
  # Each request holds pool threads for 15s in total (1+2+3+4+5) → about pool size / 15 req/s.
  # Throughput ≈ min(pool size / 15, tomcat threads / 5), so a tuned variant must raise both
  # (tomcat threads ≥ pool size / 3), e.g.
  #   --benchmark.platform-thread-pool-size=1000 --server.tomcat.threads.max=334
  platform-thread-pool-size: 200

# Logging configuration
logging:
  level:
    root: WARN
    me.bossm0n5t3r: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
